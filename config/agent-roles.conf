# Agent role -> runtime / model / effort mapping. The ONLY place a model ID lives.
#
# Read by scripts/agent-dispatch.sh; contract in docs/agents/runtime.md.
# Shell-sourced: KEY="value", no spaces around `=`. No secrets -- authentication
# uses the runtime's own login or environment variables.
#
# Roles:
#   ORCHESTRATOR  schedules a release, verifies evidence, merges serially. high effort.
#   IMPLEMENTER   implements one issue in its own worktree. medium or high, from the
#                 issue's `Complexity` (docs/agents/issue-template.md § Execution).
#   REVIEWER      independent adversarial review in a fresh context. high effort.
#                 Prefer a different vendor than IMPLEMENTER.
#
# Per role:
#   <ROLE>_RUNTIME       claude | codex | pi -- the adapter scripts/agent-dispatch.sh
#                        translates to (`claude -p --model M --effort E`,
#                        `codex exec --model M -c model_reasoning_effort="E" -`,
#                        `pi -p --model M --thinking E @prompt`).
#   <ROLE>_MODEL         exact model ID that runtime accepts. Never an unverified guess.
#   <ROLE>_EFFORT_MEDIUM runtime-native value used for `--effort medium`.
#   <ROLE>_EFFORT_HIGH   runtime-native value used for `--effort high`.
#                        Unset = that effort is unsupported; dispatch fails (exit 3)
#                        rather than lowering it or passing the word through blindly.
#
# There is no free-form flag or command field: the dispatcher builds the whole argv,
# so nothing can override the model, the effort or the fresh session. Permissions
# and sandboxing go in the runtime's own config (e.g. its settings / config.toml).
# A leftover <ROLE>_CMD or <ROLE>_EXTRA_ARGS makes the role fail (exit 3).
#
# Shipped UNCONFIGURED on purpose: every role fails closed until SETUP.md step 1.9
# fills it in from the target runtime and a real one-line call succeeds.
# `scripts/agent-dispatch.sh --probe` checks this file and PATH only.
#
# Selection intent (not verified defaults): IMPLEMENTER on Claude Opus 5.5
# (pi registry `claude/claude-opus-5-5`), REVIEWER on GPT-6 Astra (pi registry
# `mantle/gpt-6-astra`). Confirm the exact ID and effort values your runtime
# accepts before writing them below.

ORCHESTRATOR_RUNTIME=""
ORCHESTRATOR_MODEL=""
ORCHESTRATOR_EFFORT_MEDIUM=""
ORCHESTRATOR_EFFORT_HIGH=""

IMPLEMENTER_RUNTIME=""
IMPLEMENTER_MODEL=""
IMPLEMENTER_EFFORT_MEDIUM=""
IMPLEMENTER_EFFORT_HIGH=""

REVIEWER_RUNTIME=""
REVIEWER_MODEL=""
REVIEWER_EFFORT_MEDIUM=""
REVIEWER_EFFORT_HIGH=""

# Example shape (unverified -- check `--help` and make one real call first):
#   REVIEWER_RUNTIME="codex"
#   REVIEWER_MODEL="<exact id>"
#   REVIEWER_EFFORT_MEDIUM="medium"
#   REVIEWER_EFFORT_HIGH="high"
