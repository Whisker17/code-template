# Agent role → dispatch mapping.
#
# Read by scripts/agent-dispatch.sh; explained in docs/agents/runtime.md.
# Shell-sourced, so: KEY="value", no spaces around `=`, no secrets (API keys stay
# in .env — this file is checked in).
#
# Four roles. Each runtime has its own _CMD (how to reach it as a subprocess) and
# _MODEL (which model it should run when dispatching natively instead).
#
#   IMPLEMENTER  the session reading this. Never dispatched — it is the caller.
#   REVIEWER     fresh context, >= implementer strength. The selected runtime's
#                policy decides the model; no runtime is a fallback for another.
#   ESCALATOR    strongest reasoner available. Resolves findings the review loop
#                could not close. May equal REVIEWER.
#   EXPLORER     cheap and fast, read-only codebase sweeps. Parallelised heavily,
#                so cost matters more than depth here.
#
# _CMD must be a NON-INTERACTIVE invocation that takes a prompt on stdin and
# writes the result to stdout. Verify yours with `--help` before trusting it —
# these flags change between CLI releases. `scripts/agent-dispatch.sh --probe`
# checks that the binary resolves; it cannot check that the flags are right.

# --- Claude Code -------------------------------------------------------------
# `claude -p` is print mode (non-interactive). `--model` takes a generation alias
# (`opus`, `sonnet`, `haiku`) or a pinned id.
CLAUDE_CODE_IMPLEMENTER_LABEL="claude-code:sonnet"
CLAUDE_CODE_IMPLEMENTER_EFFORT="xhigh"
CLAUDE_CODE_REVIEWER_CMD="claude -p --model opus --effort xhigh"
CLAUDE_CODE_REVIEWER_MODEL="opus"
CLAUDE_CODE_REVIEWER_EFFORT="xhigh"
CLAUDE_CODE_ESCALATOR_CMD="claude -p --model opus --effort xhigh"
CLAUDE_CODE_ESCALATOR_MODEL="opus"
CLAUDE_CODE_ESCALATOR_EFFORT="xhigh"
CLAUDE_CODE_EXPLORER_CMD="claude -p --model sonnet --effort xhigh"
CLAUDE_CODE_EXPLORER_MODEL="sonnet"
CLAUDE_CODE_EXPLORER_EFFORT="xhigh"

# --- Codex App / CLI ---------------------------------------------------------
# The Codex App main session is Luna/xhigh. Fresh review contexts are
# Terra/xhigh, and the same policy applies to escalation.
CODEX_IMPLEMENTER_LABEL="codex:gpt-5.6-luna"
CODEX_IMPLEMENTER_EFFORT="xhigh"
CODEX_REVIEWER_CMD="codex exec --model gpt-5.6-terra -c model_reasoning_effort=xhigh"
CODEX_REVIEWER_MODEL="gpt-5.6-terra"
CODEX_REVIEWER_EFFORT="xhigh"
CODEX_ESCALATOR_CMD="codex exec --model gpt-5.6-terra -c model_reasoning_effort=xhigh"
CODEX_ESCALATOR_MODEL="gpt-5.6-terra"
CODEX_ESCALATOR_EFFORT="xhigh"
CODEX_EXPLORER_CMD="codex exec --model gpt-5.6-luna -c model_reasoning_effort=xhigh"
CODEX_EXPLORER_MODEL="gpt-5.6-luna"
CODEX_EXPLORER_EFFORT="xhigh"

# --- Grok -------------------------------------------------------------------
# Grok implements with grok-4.5 at xhigh. Review deliberately crosses vendors:
# Claude Opus is the reviewer, with the same xhigh effort policy.
GROK_IMPLEMENTER_LABEL="grok:grok-4.5"
GROK_IMPLEMENTER_EFFORT="xhigh"
GROK_REVIEWER_CMD="claude -p --model opus --effort xhigh"
GROK_REVIEWER_MODEL="opus"
GROK_REVIEWER_EFFORT="xhigh"
GROK_ESCALATOR_CMD="claude -p --model opus --effort xhigh"
GROK_ESCALATOR_MODEL="opus"
GROK_ESCALATOR_EFFORT="xhigh"
GROK_EXPLORER_CMD="grok --prompt-file /dev/stdin --model grok-4.5 --reasoning-effort xhigh"
GROK_EXPLORER_MODEL="grok-4.5"
GROK_EXPLORER_EFFORT="xhigh"
