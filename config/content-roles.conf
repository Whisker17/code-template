# Content role -> runtime / model / effort mapping (decks and other content work, not code).
# Optional: delete this file if the project has no content roles. The ONLY place a content
# model ID lives; skills name a role, never a model.
#
# Read by scripts/roles.sh (list | check | get | set); contract in docs/agents/runtime.md.
# Shell-style: KEY="value", no spaces around `=`. No secrets -- authentication uses the
# runtime's own login or environment variables. scripts/agent-dispatch.sh does not read it.
#
# Roles:
#   DECK_WRITER    drafts the per-slide content of a deck (.claude/skills/slide).
#   DECK_REVIEWER  reviews the outline and design in a fresh context. Prefer a different
#                  vendor than DECK_WRITER.
#
# Per role:
#   <ROLE>_RUNTIME  claude | codex | pi.
#   <ROLE>_MODEL    exact model ID that runtime accepts. Never an unverified guess.
#   <ROLE>_EFFORT   one runtime-native effort value (the per-runtime sets are in
#                   docs/agents/runtime.md). Content roles have a single effort.
#
# The shipped defaults are the bindings of IMPLEMENTER (writer) and REVIEWER (reviewer) in
# config/agent-roles.conf. `scripts/roles.sh check` verifies this file against the runtime
# on this machine; SETUP.md step 1.9 keeps or changes each role.
#
# Changing a value is the owner's one-commit "role binding lane" pushed straight to the
# trunk (docs/GIT_WORKFLOW.md § Role binding lane): `scripts/roles.sh set ROLE ... --reason`
# does it. `.githooks/pre-push` admits it only if it changes nothing but the quoted value of
# an existing KEY="value" line. Adding or removing a role or key, or touching a comment, is
# a governance PR.

DECK_WRITER_RUNTIME="pi"
DECK_WRITER_MODEL="mantle-gateway/claude-sonnet-5-5"
DECK_WRITER_EFFORT="high"

DECK_REVIEWER_RUNTIME="pi"
DECK_REVIEWER_MODEL="magpie/codex/gpt-6-astra"
DECK_REVIEWER_EFFORT="high"
